name: Release extension

on:
  push:
    tags: ['v*']

# Needed to create the GitHub Release
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Stop early if the tag (v2.1.0) and manifest.json version (2.1.0) differ
      - name: Check tag matches manifest version
        run: |
          manifest_version=$(jq -r .version manifest.json)
          if [ "v$manifest_version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $manifest_version"
            exit 1
          fi

      - run: npm ci

      - run: npm run build

      - name: Zip dist
        run: |
          cd dist
          zip -r "../aogaku-noodle-$GITHUB_REF_NAME.zip" .

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "aogaku-noodle-$GITHUB_REF_NAME.zip" --title "$GITHUB_REF_NAME" --generate-notes
